name: Auto Release KSSmartIntentRouter

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  auto-release:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'feat(deploy): v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from PR title
        id: extract-version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Extract any version starting with 'v'
          VERSION=$(echo "$PR_TITLE" | sed -n 's/^feat(deploy): \(v[^[:space:]]*\).*$/\1/p')
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from PR title: $PR_TITLE"
            echo "Expected format: 'feat(deploy): v<version>'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.extract-version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "ERROR: Version $VERSION does not follow semantic versioning format"
            echo "Expected format: vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi

      - name: Create and push tag
        run: |
          # Check if tag already exists
          if git tag -l "${{ steps.extract-version.outputs.version }}" | grep -q "${{ steps.extract-version.outputs.version }}"; then
            echo "ERROR: Tag ${{ steps.extract-version.outputs.version }} already exists"
            exit 1
          fi
          git tag -a "${{ steps.extract-version.outputs.version }}" -m "smart-intent-sc ${{ steps.extract-version.outputs.version }}"
          git push origin "${{ steps.extract-version.outputs.version }}" || { echo "ERROR: Failed to push tag"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Auto-generate release notes
          gh release create "${{ steps.extract-version.outputs.version }}" \
            --title "smart-intent-sc ${{ steps.extract-version.outputs.version }}" \
            --generate-notes

      - name: Notify on failure
        if: failure()
        run: |
          echo "Auto-release workflow failed for PR #${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Version: ${{ steps.extract-version.outputs.version }}"
